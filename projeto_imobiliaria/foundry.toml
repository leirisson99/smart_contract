[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

fuzz = { runs = 256 }
invariant = { runs = 256, depth = 15 }

fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
amoy = "${POLYGON_AMOY_RPC_URL}"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api", chain = 80002 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
