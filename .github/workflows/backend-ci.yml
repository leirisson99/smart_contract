name: Backend CI

permissions: {}

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Postgres real: a maioria dos testes usa `prisma` contra um banco de
    # verdade (chain mockada via `vi.mock`). Os dois arquivos `*.e2e.test.ts`
    # (kyc-flow, property-flow) tambem exigem um Anvil local com os contratos
    # do PropertyFactory/Marketplace/IdentityRegistry ja deployados - fora do
    # escopo deste workflow por enquanto, por isso sao excluidos do `vitest run`
    # abaixo (ver backend/vitest.config.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://kyc:kyc@localhost:5432/kyc?schema=public"
      RPC_URL: "http://127.0.0.1:8545"
      CHAIN_ID: "31337"
      IDENTITY_REGISTRY_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      MARKETPLACE_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      PROPERTY_FACTORY_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      TRUSTED_ISSUER_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
      GAS_SPONSOR_PRIVATE_KEY: "0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a"
      GESTOR_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      ADMIN_API_KEY: "ci-admin-key"
      WALLET_ENC_KEY: "ci-wallet-enc-key-0123456789ab"
      KYC_WEBHOOK_SECRET: "ci-kyc-webhook-secret"
      PORT: "3000"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Run tests (unit/integration, exclui e2e que dependem de Anvil)
        run: npx vitest run --exclude "**/*.e2e.test.ts"
